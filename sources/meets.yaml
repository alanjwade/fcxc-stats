# =============================================================================
# Cross Country Statistics Tracker — Canonical Race Metadata
# =============================================================================
#
# This is the single source of truth for past race data. Each meet entry
# defines the meet metadata and the races within it, pointing to the raw
# source file downloaded via Playwright or copied from MileSplit.
#
# Adding a new meet:
#   1. Download the page: scraper/download_page.py <URL> sources/pages/2026/<meet>/<file>
#   2. Add an entry here with the meet info and race definitions.
#   3. Run: python scraper/scraper.py --sources sources/meets.yaml
#
# If the page format is unfamiliar, the scraper's auto-detect will try all
# registered parsers. If none match, you'll need to add a new parser in
# scraper/parsers/.
#
# Fields:
#   - name:        Display name for the meet/event
#   - date:        Race date in YYYY-MM-DD format
#   - venue:       Venue name
#   - season:      Year of the season (e.g. "2025")
#   - source:      Where the raw data lives
#       type:      "file" or "url"
#       path:      Path relative to sources/ (for type: file)
#       url:       URL (for type: url)
#   - races[]:     List of races within this meet
#       name:      Display name (e.g. "Varsity Boys")
#       distance:  Distance (e.g. "5K", "2M")
#       class:     Category: "varsity", "jv", "freshman"
#       gender:    "boys", "girls", or "mixed"
#       section_title:  Title string used by parsers to find the section in a
#                       combined results file (omitted if file is per-race)
# =============================================================================

