# Backup configuration for fcxc-stats
# See /README.md#backup-system for full documentation.

pre_backup: []
  # No pre-backup commands needed; SQLite database file is already in a consistent state
  # when the container is running. If you need to ensure consistency, consider
  # stopping the container briefly or adding a database checkpoint command.

paths:
  - /opt/homelab/fcxc-stats/data

tiers:
  local: true      # Back up to local restic repo (USB drive)
  offsite: false   # Back up to rclone → S3 Glacier Deep Archive
